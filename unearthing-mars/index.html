<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Unearthing Mars Lab Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Kalam:wght@700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: the lab sheet on the left plays one short demo, then holds; the right panel says exactly what to do on paper, then Next. */
:root {
  --bg: #EDF0F5; --surface: #FFFFFF; --fg: #15203A; --muted: #4F5B72; --line: #D2D9E5;
  --accent: #1F4FD1; --accent-ink: #FFFFFF; --pink: #C2366E; --pink-soft: #FBE3EC; --ok: #1F7A4A; --ok-soft: #E2F3E9;
  --paper: #FBFAF6; --ink: #1B2438; --grid: #E2E6EE; --red: #C8462E; --green: #2E8B57; --sun: #E8A33D; --red-t: #B83A22; --green-t: #1F7A4A;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1525; --surface: #152038; --fg: #E8EDF6; --muted: #A6B1C6; --line: #2A3755;
  --accent: #7C9EFF; --accent-ink: #0D1525; --pink: #F28DB3; --pink-soft: #3A1E2D; --ok: #7FD3A2; --ok-soft: #173326; --red-t: #FF8A6E; --green-t: #6FD69A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1525; --surface: #152038; --fg: #E8EDF6; --muted: #A6B1C6; --line: #2A3755;
  --accent: #7C9EFF; --accent-ink: #0D1525; --pink: #F28DB3; --pink-soft: #3A1E2D; --ok: #7FD3A2; --ok-soft: #173326; --red-t: #FF8A6E; --green-t: #6FD69A; color-scheme: dark }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { max-width: 1440px; margin: 0 auto; padding-block: 14px 20px; display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; flex-direction: column; gap: 10px; }
.top-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; letter-spacing: -.01em; margin: 0; }
.brand span { color: var(--muted); font-weight: 500; }
.count { color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; margin: 0; }
.bar { display: flex; gap: 4px; }
.bar button { flex: 1; height: 10px; border: 0; padding: 0; border-radius: 3px; background: var(--line); cursor: pointer; }
.bar button.done { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.bar button.now { background: var(--accent); }
.bar button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.stage { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 20px; align-items: start; }
.view { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sheet { position: relative; container-type: inline-size; aspect-ratio: 1100 / 940; width: min(100%, calc((100dvh - 200px) * 1100 / 940)); max-width: 100%; margin-inline: auto;
  border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(10, 20, 40, .18); background: var(--paper); }
.sheet svg { display: block; width: 100%; height: 100%; }
.viewbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: min(100%, calc((100dvh - 200px) * 1100 / 940)); max-width: 100%; margin-inline: auto; }
.status { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; min-width: 0; }
.status .meter { width: 90px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
.status .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
.status.turn { color: var(--ok); }
.status.turn .meter { display: none; }
.ghost { font: inherit; font-weight: 600; font-size: .95rem; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.ghost:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.eyebrow { margin: 0; font-size: .85rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.panel h1 { margin: 0; font-family: var(--font-display); font-size: 1.85rem; line-height: 1.12; letter-spacing: -.015em; text-wrap: balance; }
.sub { margin: 0; font-size: .82rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.todo label { display: flex; gap: 12px; align-items: flex-start; font-size: 1.12rem; line-height: 1.45; cursor: pointer; }
.todo input { width: 1.35rem; height: 1.35rem; margin-top: .12rem; flex: none; accent-color: var(--accent); cursor: pointer; }
.todo input:checked + span { color: var(--muted); }
.record { display: block; background: var(--pink-soft); color: var(--fg); border-left: 5px solid var(--pink); border-radius: 6px; padding: 10px 14px; font-size: 1.05rem; }
.record b { color: var(--pink); }
.check { background: var(--ok-soft); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.check strong { color: var(--ok); font-size: .82rem; letter-spacing: .1em; text-transform: uppercase; }
.check p { margin: 0; font-size: 1.05rem; }
.nav { display: flex; gap: 10px; margin-top: 4px; }
.nav button { font: inherit; font-weight: 700; font-size: 1.05rem; border-radius: 10px; padding: 13px 18px; cursor: pointer; }
.nav .back { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.nav .next { flex: 1; background: var(--accent); color: var(--accent-ink); border: 0; }
.nav .next:hover { filter: brightness(1.08); }
.nav button:disabled { opacity: .4; cursor: default; }
.keys { margin: 0; color: var(--muted); font-size: .85rem; }
.pq { background: var(--bg); border-left: 5px solid var(--accent); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.pq-l { margin: 0; font-size: .9rem; color: var(--muted); }
.pq-t { margin: 0; font-weight: 700; font-size: 1.05rem; line-height: 1.4; white-space: pre-line; }
.gate { margin: 0; font-weight: 700; font-size: .98rem; color: var(--pink); }
.bar button:disabled { opacity: .35; cursor: not-allowed; }
.skip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.skip span { font-size: .85rem; font-weight: 700; color: var(--muted); margin-right: 2px; }
.skip button { font: inherit; font-size: .88rem; font-weight: 600; padding: 5px 13px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.skip button:hover { border-color: var(--accent); }
.skip button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.todo b { color: var(--fg); }
.todo input:checked + span b { color: var(--muted); }
.c-table.c-t5 { grid-template-columns: 24% 20% 18% 20% 18%; }
.c-table.c-t4 { grid-template-columns: 22% 22% 22% 34%; }
.c-table.c-t3 { grid-template-columns: 30% 32% 38%; }
.c-table.c-t5 p, .c-table.c-sm p { font-size: 2.45cqw; padding: .9cqw 1.2cqw; }
.c-table.c-t5 .th, .c-table.c-sm .th { font-size: 1.9cqw; }
.c-table .hl-sun { background: #FFF1D2; } .c-table .hl-earth { background: #E2F3E9; }
.c-table .th.hl-sun { background: #FBDFA2; } .c-table .th.hl-earth { background: #BFE5CD; }
.c-key { font-size: 2.85cqw; line-height: 1.3; padding: 1cqw 1.8cqw; border-left: .8cqw solid #9AA3B5; background: #EEF1F7; border-radius: .6cqw; }
.c-key.sun { border-left-color: #E8A33D; background: #FFF1D2; } .c-key.earth { border-left-color: #2E8B57; background: #E2F3E9; }
.svt { font-family: var(--font-body); font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: middle; }

/* The paper drawing */
.lab { font-family: var(--font-body); font-weight: 700; font-size: 28px; fill: var(--ink); text-anchor: middle; dominant-baseline: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 7px; stroke-linejoin: round; }
.lab-s { font-size: 23px; }
.pnum { font-family: var(--font-body); font-size: 6.6px; font-weight: 700; fill: #15181F; text-anchor: middle; dominant-baseline: middle; letter-spacing: -.02em; }
.pnum.pred { fill: #C0392B; font-size: 4.7px; font-weight: 700; letter-spacing: 0; }
.zt { font-family: var(--font-body); font-weight: 700; font-size: 22px; fill: var(--ink); }
.zr { font-family: var(--font-body); font-weight: 800; font-size: 30px; fill: #C0392B; text-anchor: end; }
.lab.hw { font-family: "Kalam", "Comic Sans MS", "Segoe Print", cursive; font-weight: 700; font-size: 40px; fill: #2A2F3C; }
.lab.hw-g { fill: var(--green); }
.hdr { font-family: var(--font-body); font-weight: 700; font-size: 25px; fill: var(--ink); letter-spacing: .03em; }
.card { position: absolute; inset: 9% 7% 6%; color: var(--ink); display: flex; flex-direction: column; gap: 2.4cqw; }
.card > *, .card li { margin: 0; }
.c-h { font-size: 2.4cqw; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.c-big { font-family: var(--font-display); font-size: 4.3cqw; line-height: 1.18; font-weight: 700; }
.c-row { font-size: 3.4cqw; line-height: 1.3; }
.c-note { font-size: 2.9cqw; line-height: 1.3; color: #4A5468; }
.c-ex { font-size: 2.9cqw; line-height: 1.35; background: #EEF1F7; border-radius: 1cqw; padding: 1.4cqw 2cqw; }
.c-list { padding-left: 3.6cqw; display: flex; flex-direction: column; gap: 1.2cqw; font-size: 3.2cqw; }
.c-table { display: grid; grid-template-columns: 15% 27% 29% 29%; border: .3cqw solid var(--ink); }
.c-table p { margin: 0; padding: 1.4cqw 1.6cqw; border: .14cqw solid #9AA3B5; font-size: 3.2cqw; line-height: 1.2; }
.c-table .th { font-size: 2.1cqw; font-weight: 700; background: #EEF1F7; }
.c-table .m3 { background: #DDF0E4; font-weight: 700; }
.c-two { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4cqw; }
.c-box { border: .3cqw solid var(--ink); border-radius: 1.2cqw; padding: 1.8cqw 2.2cqw; display: flex; flex-direction: column; gap: 1.1cqw; }
.c-box.sun { background: #FFF1D2; } .c-box.earth { background: #E2F3E9; }
.c-box h3 { margin: 0; font-family: var(--font-display); font-size: 3.5cqw; line-height: 1.1; }
.c-box p { margin: 0; font-size: 2.75cqw; line-height: 1.3; }
.c-box .root { font-weight: 700; font-size: 3cqw; }
.c-sum { font-size: 3.2cqw; line-height: 1.3; font-weight: 700; background: #EEF1F7; border-radius: 1cqw; padding: 1.4cqw 2cqw; }
.c-q { font-family: var(--font-display); font-size: 3.7cqw; line-height: 1.22; font-weight: 700; }
.c-p { font-size: 2.5cqw; line-height: 1.42; }
.c-small { font-size: 2.15cqw; line-height: 1.32; }
.xm { position: relative; display: flex; align-items: center; gap: 3cqw; font-weight: 700; height: 12cqw; }
.xm .fr { display: inline-flex; flex-direction: column; align-items: center; text-align: center; }
.xm .fr span:first-child { border-bottom: .35cqw solid var(--ink); padding: 0 1cqw .6cqw; }
.xm .fr span:last-child { padding-top: .6cqw; }
.xm .eq { font-size: 4cqw; position: relative; z-index: 1; background: var(--paper); padding: 0 .6cqw; line-height: 1; }
.xm svg { position: absolute; left: 0; top: 0; width: 62cqw; height: 12cqw; pointer-events: none; overflow: visible; z-index: 0; }
.t-red { color: var(--red-t); font-weight: 700; } .t-green { color: var(--green-t); font-weight: 700; }
.card .t-red { color: #C8462E; } .card .t-green { color: #237A4B; }
.t-pink { color: var(--pink); background: var(--pink-soft); font-weight: 700; border-radius: 4px; padding: 0 .2em; }
.card .t-pink { color: #C2366E; background: #FBE3EC; }
.t-yellow { color: #15203A; background: #FFE27A; font-weight: 700; border-radius: 4px; padding: 0 .2em; }

@media (max-width: 900px) {
  .stage { grid-template-columns: 1fr; }
  .sheet, .viewbar { width: 100%; }
  .panel h1 { font-size: 1.55rem; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="app">
  <header class="top">
    <div class="top-row">
      <p class="brand">Unearthing Mars <span>Student Directions</span></p>
      <p class="count" id="count">Screen 1 of 24</p>
    </div>
    <div class="bar" id="bar" aria-label="Jump to a screen"></div>
    <nav class="skip" id="skip" aria-label="Skip to a part"><span>Skip to:</span></nav>
  </header>

  <main class="stage">
    <section class="view" aria-label="Demonstration">
      <div class="sheet" id="sheet">
        <svg id="art" viewBox="760 70 1100 940" role="img" aria-label="Lab sheet demonstration"></svg>
        <div class="card" id="card" hidden></div>
      </div>
      <div class="viewbar">
        <div class="status" id="status"><span class="meter"><i id="meter"></i></span><span id="statusText">Watch</span></div>
        <button class="ghost" id="replay" type="button">Replay</button>
      </div>
    </section>

    <section class="panel" aria-live="polite">
      <p class="eyebrow" id="tag"></p>
      <h1 id="title"></h1>
      <div class="pq" id="pq" hidden><p class="pq-l">Question from Student Answer Packet:</p><p class="pq-t" id="pqText"></p></div>
      <p class="sub" id="sub">Do this on your paper</p>
      <ul class="todo" id="todo"></ul>
      <div class="record" id="record" hidden></div>
      <div class="check" id="check" hidden><strong>Check yours</strong><p id="checkText"></p></div>
      <nav class="nav">
        <button class="back" id="back" type="button">Back</button>
        <button class="next" id="next" type="button">Next</button>
      </nav>
      <p class="gate" id="gate" hidden>Check every box to unlock Next.</p>
      <p class="keys">Tip: the arrow keys also go back and next.</p>
    </section>
  </main>
</div>

<script>
(function () {
  // ---------- geometry ----------
  const E = { cx: 1310, cy: 540, a: 320, b: 318.6, c: 30 };   // MODEL 1 ellipse, Sun at the right focus
  const M = { cx: 1300, cy: 540, R: 230 };                    // MODEL 2, R = Earth's orbit
  const PRE = [['M1', 150], ['M2', 184], ['M4', 42], ['M5', 219], ['M6', 96]];   // positions read from the class MODEL 2 sheet
  const f = n => (+n).toFixed(1), cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const back = x => { x = cl(x); if (x <= 0) return 0; const u = x - 1; return 1 + 2.7 * u * u * u + 1.7 * u * u; };
  const win = (w, t) => w == null ? 0 : typeof w === 'number' ? w : cl((t - w[0]) / (w[1] - w[0]));
  const pt = (r, deg) => { const a = deg * Math.PI / 180; return [M.cx + r * M.R * Math.cos(a), M.cy - r * M.R * Math.sin(a)]; };
  const marsR = th => 1.5107 / (1 + 0.0934 * Math.cos((th - 330) * Math.PI / 180));
  // Triangulation of M3 from the real data: Earth at 5 deg and 323 deg, Mars seen at 284 deg and 347 deg.
  const T = (() => {
    const dir = d => [Math.cos(d * Math.PI / 180), -Math.sin(d * Math.PI / 180)];
    const E1 = pt(1, 5), E2 = pt(1, 323), d1 = dir(284), d2 = dir(347);
    const det = d1[0] * (-d2[1]) + d2[0] * d1[1], rx = E2[0] - E1[0], ry = E2[1] - E1[1];
    const a = (rx * (-d2[1]) + d2[0] * ry) / det, b = (d1[0] * ry - d1[1] * rx) / det, g = 80;
    return { E1, E2, M3: [E1[0] + a * d1[0], E1[1] + a * d1[1]], G1: [E1[0] + g * d1[0], E1[1] + g * d1[1]], G2: [E2[0] + g * d2[0], E2[1] + g * d2[1]],
      L1: [E1[0] + 1.4 * a * d1[0], E1[1] + 1.4 * a * d1[1]], L2: [E2[0] + 1.7 * b * d2[0], E2[1] + 1.7 * b * d2[1]] };
  })();
  const M1p = pt(marsR(150), 150);
  // How each pre-plotted point was found: Earth on a first date, then 687 days later (Earth ends up about 43 degrees behind).
  const TRI_E = { M1: [157, 115], M2: [195, 155], M4: [77, 39], M5: [244, 200], M6: [123, 78] };   // Earth's two positions for each point, read from the sheet
  const TRI = PRE.map(a => ({ n: a[0], th: a[1], X: pt(marsR(a[1]), a[1]), A: pt(1, TRI_E[a[0]][0]), B: pt(1, TRI_E[a[0]][1]) }));

  // ---------- drawing ----------
  const L = (p, id, txt, s) => '<text id="' + id + '" class="lab' + (s ? ' lab-s' : '') + '" x="' + f(p[0]) + '" y="' + f(p[1]) + '">' + txt + '</text>';
  const dot = (id, p, r, fill, sc) => '<g id="' + id + '" transform="translate(' + f(p[0]) + ' ' + f(p[1]) + ')' + (sc ? ' scale(0)' : '') + '"><circle r="' + r + '" style="fill:' + fill + '"/></g>';
  const line = (id, a, b, col, w) => '<path id="' + id + '" pathLength="1" d="M' + f(a[0]) + ' ' + f(a[1]) + ' L' + f(b[0]) + ' ' + f(b[1]) + '" style="fill:none;stroke:' + col + ';stroke-width:' + w + ';stroke-linecap:round;opacity:0"/>';
  const pin = '<ellipse cx="7" cy="9" rx="13" ry="6" style="fill:rgba(0,0,0,.2)"/><circle r="12" style="fill:var(--sun);stroke:var(--ink);stroke-width:2"/><circle cx="-4" cy="-4" r="4" style="fill:var(--paper);opacity:.75"/>';
  const pencil = '<path d="M0 0 L-11 -30 H11 Z" style="fill:#E9C99A"/><path d="M0 0 L-4 -11 H4 Z" style="fill:var(--red)"/><rect x="-11" y="-200" width="22" height="170" style="fill:var(--red)"/><rect x="-11" y="-200" width="8" height="170" style="fill:rgba(255,255,255,.22)"/><rect x="-11" y="-226" width="22" height="28" rx="4" style="fill:#D9C2BC"/>';
  const ell1 = () => { let d = ''; for (let i = 0; i <= 120; i++) { const a = i / 120 * Math.PI * 2; d += (i ? ' L' : 'M') + f(E.cx + E.a * Math.cos(a)) + ' ' + f(E.cy - E.b * Math.sin(a)); } return d; };
  const ell2 = () => { let d = ''; for (let i = 0; i <= 120; i++) { const th = 330 + i * 3, p = pt(marsR(th), th); d += (i ? ' L' : 'M') + f(p[0]) + ' ' + f(p[1]); } return d; };

  function buildSvg() {
    const sx = E.cx + E.c, fx = E.cx - E.c, y = E.cy;
    let s = '<defs><linearGradient id="hSk" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F8D6BC"/><stop offset=".55" stop-color="#F1C2A0"/><stop offset="1" stop-color="#DFA27C"/></linearGradient><linearGradient id="hNl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFF5EF"/><stop offset="1" stop-color="#F2C6B6"/></linearGradient><linearGradient id="hSl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2A5BDB"/><stop offset="1" stop-color="#163A9E"/></linearGradient><linearGradient id="fgG" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="230" y2="0"><stop offset=".6" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient><mask id="fgFade" maskUnits="userSpaceOnUse" x="-10" y="-40" width="260" height="80"><rect x="-10" y="-40" width="260" height="80" fill="url(#fgG)"/></mask><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--ink)"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" x="760" y="70"><path d="M40 0 H0 V40" style="fill:none;stroke:var(--grid);stroke-width:1.5"/></pattern></defs>' +

      card: '<p class="c-h" data-at="0">Focus Questions</p><p class="c-note" data-at=".2">While performing this investigation, use the following focus questions to guide your work.</p><ol class="c-list" style="font-size:3cqw"><li data-at=".6">How did Kepler’s Laws affect the ability of scientists to determine the locations and the motions of objects in the solar system?</li><li data-at="1.1">Which mathematical and/or computational representations are used to plot the location of Mars and predict its orbit?</li><li data-at="1.6">How do gravitational effects change the orbits of objects in the solar system?</li><li data-at="2.1">How can the principles of relative motion and perspective from Earth and other solar system objects be used to describe celestial phenomena today?</li></ol>' },
    { part: 'Start', tag: 'Start · Purpose', title: 'Purpose of Investigation', dur: 1.8,
      todo: ['Read the Purpose of Investigation on the left. Then answer Part A (#1–2) and Part B (#3–4) on the front page of your PINK Student Answer Packet.'],
      record: 'Part A and Part B, front page of your PINK Student Answer Packet', check: 'Every Part A and Part B answer is in this reading. For Part B, if a statement is false, fix it so it is true.',
      draw: { mode: 'card' },
      card: '<p class="c-h" data-at="0">Purpose of Investigation</p><p class="c-p" data-at=".2">In the late 1500s, Tycho Brahe made several very accurate observations of the positions of Mars 20 years before the telescope was even invented. In fact, his measurements can be used to locate astronomical objects to this day. Johannes Kepler, Brahe’s assistant, later determined the orbital period of Mars to be 687 Earth days. With Brahe’s data and the orbital period of Mars, Kepler devised a method of triangulation, using his perspective from Earth to determine the location of Mars in its orbit.</p><p class="c-p" data-at=".7">Mars is a major focus for space exploration in the present day. The goal of the United States’ exploration of Mars is to provide researchers with a continuous flow of discovery and scientific information, obtained from robotic orbiters, landers, and mobile laboratories interconnected by a sophisticated Mars/Earth communications network. The present-day planning and implementation of space probe missions to Mars utilize the same principles of relative motion and gravity that were investigated by Brahe in the late 1500s and by Kepler in the early 1600s.</p>' },
    { part: 'Start', tag: 'Start · Your tasks', title: 'Your tasks in this investigation', dur: 2.8,
      todo: ['Read your tasks and the summary on the left. Then answer Part C (#5–6) on the front page of your PINK Student Answer Packet.'],
      record: 'Part C, front page of your PINK Student Answer Packet', check: 'Every Part C answer is in the tasks and the summary.',
      draw: { mode: 'card' },
      card: '<p class="c-h" data-at="0">Your tasks</p><p class="c-small" data-at=".2">Your tasks in this investigation will be to use mathematical and computational representations to:</p><ul class="c-list" style="font-size:2.15cqw;gap:.8cqw"><li data-at=".5"><b>Create a model</b> of the orbit of Mars from given and derived calculations</li><li data-at=".9"><b>Create a second model</b> of the orbit of Mars using the same triangulation method as Johannes Kepler</li><li data-at="1.3"><b>Conduct a percent error analysis</b> between the known eccentricity of Mars and the calculated eccentricity of Mars from the second predicted model of Mars’ orbit in this investigation</li><li data-at="1.7"><b>Identify patterns of evidence</b> from the early history of astronomical observations of Mars and Earth and use principles of relative motion, perspective, and gravity to describe the motions of solar system objects</li></ul><p class="c-h" data-at="2.1">Summary</p><p class="c-small" data-at="2.3">You will be using mathematical and computational representations to create a model of the orbit of Mars. You will then triangulate various locations to draw a predicted orbit of Mars using six plotted locations. Finally, you will calculate your percent error by comparing your eccentricity from the second model to the accepted eccentricity of Mars.</p>' },
    { part: 'Part 1', tag: 'Part 1 · Step 1', title: 'Write your name and check your materials', dur: 3.6,
      todo: ['Write your name on the PINK Student Answer Packet.', 'Check your clear container against the list on the left.', 'Get 1 circular protractor, 1 metric ruler, 1 corkboard and 1 calculator.'],
      check: 'Your Model Orbit pages are attached to your PINK packet.', draw: { mode: 'card' },
      card: '<p class="c-h" data-at="0">Materials</p><p class="c-note" data-at=".3">In your clear container (shared with your partner):</p><ul class="c-list"><li data-at=".8">2 red colored pencils</li><li data-at="1.2">2 green colored pencils</li><li data-at="1.6">2 small containers, each holding 2 push pins and 1 string</li><li data-at="2">2 pencil sharpeners</li></ul><p class="c-note" data-at="2.5">You also need:</p><ul class="c-list"><li data-at="2.9">1 circular protractor, 1 metric ruler, 1 corkboard, 1 calculator</li></ul>' },
    { part: 'Part 1', tag: 'Part 1 · Step 2', title: 'Find the distance between the foci', dur: 4.6,
      todo: ['Find #2 in your PINK packet. The eccentricity formula is missing the distance between foci.', 'Use the accepted eccentricity for Mars: 0.094.', 'Cross multiply to solve. Show all work.', 'Round to the nearest tenth.'],
      record: 'PINK packet #2', check: 'Your answer should be about 1.5 cm.', draw: { mode: 'card' },
      card: '<p class="c-h" data-at="0">PINK packet #2</p><p class="c-row" data-at=".3">eccentricity = distance between foci ÷ length of major axis</p><p class="c-note" data-at="1">Write it as two fractions, then cross multiply:</p>' +
        '<div class="xm" data-at="1.4"><span class="fr" style="width:16cqw;font-size:3.6cqw"><span>0.094</span><span>1</span></span><span class="eq">=</span><span class="fr" style="width:36cqw;font-size:2.9cqw"><span>distance between foci</span><span>length of major axis</span></span>' +
        '<svg viewBox="0 0 62 12"><defs><marker id="xmA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" style="fill:#1F4FD1"/></marker></defs><path d="M14.6 3.4 L24.6 8.6" style="fill:none;stroke:#1F4FD1;stroke-width:.35;marker-end:url(#xmA)"/><path d="M14.6 8.6 L24.6 3.4" style="fill:none;stroke:#1F4FD1;stroke-width:.35;marker-end:url(#xmA)"/></svg></div>' +
        '<p class="c-row" data-at="2.6" style="font-size:3cqw;font-weight:700;white-space:nowrap;background:#EEF1F7;border-radius:1cqw;padding:1.4cqw 2cqw;align-self:flex-start">distance between foci = 0.094 × length of major axis</p><p class="c-note" data-at="4.1">Use the length of the major axis given in your packet. Round to the nearest tenth.</p>' },

    { part: 'Part 2', tag: 'Part 2 · Read first', title: 'Heliocentric vs. geocentric longitude', dur: 4, read: true,

        'Heliocentric (helio = Sun): measured from the Sun. It shows where Earth was.',

      card: '<p class="c-h" data-at="0">Two angles for every date</p><div class="c-two" data-at=".3">' +
        '<div class="c-box sun"><h3>Heliocentric</h3><p class="root">helio = Sun</p><p>Measured from the <b>Sun</b></p><p>Shows <b>where Earth was</b></p></div>' +
        '<div class="c-box earth"><h3>Geocentric</h3><p class="root">geo = Earth</p><p>Measured from <b>Earth</b></p><p>Shows <b>which way to look</b> to see Mars</p></div></div>' +

    { part: 'Part 2', tag: 'Part 2 · Steps 14A–14B', title: 'Measure each side of the Sun', dur: 3.6,

    { part: 'Calculate', tag: 'Calculate · Step 15', title: 'Calculate the eccentricity', dur: 3.6,
      todo: ['Find #15 in your PINK packet.', 'Divide: distance between foci (#14D) ÷ length of major axis (#13).', 'Keep cm with each number when you set it up: ___ cm ÷ ___ cm.', 'Your eccentricity has NO units. The cm on the top and the cm on the bottom cancel out.', 'Show your work. Round to the nearest thousandth (3 decimal places).'],
      record: 'PINK packet #15', check: 'Mars’ orbit is close to a circle, so your answer should be a small decimal near 0.094.', draw: { mode: 'card' },
      card: '<p class="c-h" data-at="0">PINK packet #15</p><p class="c-big" data-at=".3">eccentricity = distance between foci ÷ length of major axis</p><p class="c-row" data-at="1.3">eccentricity = #14D (cm) ÷ #13 (cm)</p><p class="c-row" data-at="1.9">cm ÷ cm cancel out, so eccentricity has <b>no units</b>.</p><p class="c-note" data-at="2.6">Rounding example only (not the answer):</p><p class="c-ex" data-at="3">0.08734 rounds to 0.087</p>' },
    { part: 'Calculate', tag: 'Calculate · Step 16', title: 'Calculate your percent error', dur: 4.6,
      todo: ['Find #16 in your PINK packet.', 'Subtract: calculated value (#15) − accepted value (0.094). If your calculated value is LOWER than 0.094, flip them: 0.094 − calculated value. Your difference should never be negative.', 'Divide by 0.094, then multiply by 100.', 'Show your work. Round to the nearest tenth.'],
      record: 'PINK packet #16', check: 'Percent error is always positive. A smaller percent means your model was closer to the accepted value.', draw: { mode: 'card' },
      card: '<p class="c-h" data-at="0">PINK packet #16</p><p class="c-big" data-at=".3">percent error = (difference ÷ 0.094) × 100</p><p class="c-row" data-at="1.1"><b>Step 1:</b> Subtract calculated − accepted. If your calculated value is LOWER than 0.094, flip them: 0.094 − calculated.</p><div class="c-two" data-at="2"><div class="c-box sun"><h3>Lower than 0.094: flip</h3><p>Example value: 0.087</p><p>0.094 − 0.087 = 0.007</p><p>0.007 ÷ 0.094 = 0.0745</p><p>0.0745 × 100 = <b>7.4%</b></p></div><div class="c-box earth"><h3>Higher than 0.094</h3><p>Example value: 0.100</p><p>0.100 − 0.094 = 0.006</p><p>0.006 ÷ 0.094 = 0.0638</p><p>0.0638 × 100 = <b>6.4%</b></p></div></div><p class="c-note" data-at="3.4">Examples only, not your answer. Subtract first, then divide. Your percent error is always positive.</p>' },
