<style>
/* Layout: the lab sheet on the left plays one short demo, then holds; the right panel says exactly what to do on paper, then Next. */
:root {
  --bg: #EDF0F5; --surface: #FFFFFF; --fg: #15203A; --muted: #4F5B72; --line: #D2D9E5;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1525; --surface: #152038; --fg: #E8EDF6; --muted: #A6B1C6; --line: #2A3755;
  --accent: #7C9EFF; --accent-ink: #0D1525; --pink: #F28DB3; --pink-soft: #3A1E2D; --ok: #7FD3A2; --ok-soft: #173326; --red-t: #FF8A6E; --green-t: #6FD69A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1525; --surface: #152038; --fg: #E8EDF6; --muted: #A6B1C6; --line: #2A3755;
  --accent: #7C9EFF; --accent-ink: #0D1525; --pink: #F28DB3; --pink-soft: #3A1E2D; --ok: #7FD3A2; --ok-soft: #173326; --red-t: #FF8A6E; --green-t: #6FD69A; color-scheme: dark }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { max-width: 1440px; margin: 0 auto; padding-block: 14px 20px; display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; flex-direction: column; gap: 10px; }

.stage { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 20px; align-items: start; }
.view { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.sheet svg { display: block; width: 100%; height: 100%; }
.viewbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: min(100%, calc((100dvh - 200px) * 1100 / 940)); max-width: 100%; margin-inline: auto; }
.status { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; min-width: 0; }
.status .meter { width: 90px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
.status .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
.status.turn { color: var(--ok); }
.status.turn .meter { display: none; }
.ghost { font: inherit; font-weight: 600; font-size: .95rem; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.ghost:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.skip button:hover { border-color: var(--accent); }
.skip button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.todo b { color: var(--fg); }
.todo input:checked + span b { color: var(--muted); }
.c-table.c-t5 { grid-template-columns: 24% 20% 18% 20% 18%; }
.c-table.c-t4 { grid-template-columns: 22% 22% 22% 34%; }
.c-table.c-t3 { grid-template-columns: 30% 32% 38%; }

.c-table.c-t5 .th, .c-table.c-sm .th { font-size: 1.9cqw; }

.zt { font-family: var(--font-body); font-weight: 700; font-size: 22px; fill: var(--ink); }
.zr { font-family: var(--font-body); font-weight: 800; font-size: 30px; fill: #C0392B; text-anchor: end; }

.c-table { display: grid; grid-template-columns: 15% 27% 29% 29%; border: .3cqw solid var(--ink); }

.c-two { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4cqw; }
.c-box { border: .3cqw solid var(--ink); border-radius: 1.2cqw; padding: 1.8cqw 2.2cqw; display: flex; flex-direction: column; gap: 1.1cqw; }

.c-q { font-family: var(--font-display); font-size: 3.7cqw; line-height: 1.22; font-weight: 700; }
.c-p { font-size: 2.5cqw; line-height: 1.42; }
.card mark { background: #FFE27A; color: inherit; padding: 0 .3cqw; border-radius: .4cqw; }
.card sup.q { font-size: 1.7cqw; font-weight: 800; color: #C2366E; margin-left: .3cqw; }
.c-small { font-size: 2.15cqw; line-height: 1.32; }
.xm { position: relative; display: flex; align-items: center; gap: 3cqw; font-weight: 700; height: 12cqw; }
.xm .fr { display: inline-flex; flex-direction: column; align-items: center; text-align: center; }
.xm .fr span:first-child { border-bottom: .35cqw solid var(--ink); padding: 0 1cqw .6cqw; }
.xm .fr span:last-child { padding-top: .6cqw; }
.sh2 { display: flex; align-items: center; gap: 2.2cqw; font-size: 3.8cqw; font-weight: 700; border: .25cqw dashed #9AA3B5; border-radius: 1cqw; padding: 1.4cqw 2.4cqw; background: #fff; align-self: flex-start; }
.sh2 .fr { display: inline-flex; flex-direction: column; align-items: center; min-width: 14cqw; }
.sh2 .fr span:first-child { border-bottom: .35cqw solid var(--ink); padding: 0 1cqw .6cqw; }
.sh2 .fr span:last-child { padding-top: .6cqw; }
.sh2 .lbls { display: flex; flex-direction: column; gap: 2.6cqw; font-size: 2.5cqw; font-weight: 500; color: #4A5468; }
.xm .eq { font-size: 4cqw; position: relative; z-index: 1; background: var(--paper); padding: 0 .6cqw; line-height: 1; }
.xm svg { position: absolute; left: 0; top: 0; width: 62cqw; height: 12cqw; pointer-events: none; overflow: visible; z-index: 0; }
.t-red { color: var(--red-t); font-weight: 700; } .t-green { color: var(--green-t); font-weight: 700; }
.card .t-red { color: #C8462E; } .card .t-green { color: #237A4B; }
.t-pink { color: var(--pink); background: var(--pink-soft); font-weight: 700; border-radius: 4px; padding: 0 .2em; margin-right: -.1em; }
.card .t-pink { color: #C2366E; background: #FBE3EC; }
.t-yellow { color: #15203A; background: #FFE27A; font-weight: 700; border-radius: 4px; padding: 0 .2em; }

/* PINK packet #16, drawn like the paper */
.pk-h { font-size: 2.35cqw; line-height: 1.3; }
.pk-l { font-size: 2.15cqw; line-height: 1.3; padding-left: 4cqw; display: flex; align-items: baseline; gap: .8cqw; flex-wrap: wrap; }

.pk-box { border: .2cqw solid var(--ink); background: #fff; display: flex; flex-direction: column; }

.pk-info b:first-child { color: #1F4FD1; }
.pk-hint { font-size: 1.9cqw; font-style: italic; }

.pk-tag { display: inline-block; white-space: nowrap; margin-left: .6cqw; background: #EEF1F7; border-radius: .5cqw; padding: .1cqw .8cqw; font-size: 1.7cqw; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #4A5468; }
@media (max-width: 900px) {
  .stage { grid-template-columns: 1fr; }

<div class="app">
  <header class="top">
    <div class="top-row">
      <p class="brand">Unearthing Mars <span>Student Directions</span></p>

<script>
(function () {
  // ---------- geometry ----------
  const E = { cx: 1310, cy: 540, a: 320, b: 318.6, c: 30 };   // MODEL 1 ellipse, Sun at the right focus
  const M = { cx: 1300, cy: 540, R: 230 };                    // MODEL 2, R = Earth's orbit
  const PRE = [['M1', 150], ['M2', 184], ['M4', 42], ['M5', 219], ['M6', 96]];   // positions read from the class MODEL 2 sheet
  const f = n => (+n).toFixed(1), cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const back = x => { x = cl(x); if (x <= 0) return 0; const u = x - 1; return 1 + 2.7 * u * u * u + 1.7 * u * u; };
  const win = (w, t) => w == null ? 0 : typeof w === 'number' ? w : cl((t - w[0]) / (w[1] - w[0]));
  const pt = (r, deg) => { const a = deg * Math.PI / 180; return [M.cx + r * M.R * Math.cos(a), M.cy - r * M.R * Math.sin(a)]; };
  const marsR = th => 1.5107 / (1 + 0.0934 * Math.cos((th - 330) * Math.PI / 180));
  // Triangulation of M3 from the real data: Earth at 5 deg and 323 deg, Mars seen at 284 deg and 347 deg.
  const T = (() => {

    if (ci >= 0) { const o = TRI[ci], t0 = .3 + ci * 2.5; lab('tal', o.A, cl((t - t0) / .4)); lab('tbl', o.B, cl((t - t0 - 1) / .4)); } else { op('tal', 0); op('tbl', 0); }

      draw: { mode: 'card' },
      card: '<p class="c-h" data-at="0">Purpose of Investigation</p><p class="c-p" data-at=".2">In the late 1500s, Tycho Brahe made several very accurate observations of the positions of Mars <mark>20 years before the telescope was even invented</mark><sup class="q">#1</sup>. In fact, <mark>his measurements can be used to locate astronomical objects to this day</mark><sup class="q">#3</sup>. Johannes Kepler, Brahe’s assistant, later determined <mark>the orbital period of Mars to be 687 Earth days</mark><sup class="q">#2</sup>. With Brahe’s data and the orbital period of Mars, Kepler devised a <mark>method of triangulation</mark><sup class="q">#2</sup>, using his perspective from Earth to determine the location of Mars in its orbit.</p><p class="c-p" data-at=".7">Mars is a major focus for space exploration in the present day. The goal of the United States’ exploration of Mars is to provide researchers with a continuous flow of discovery and scientific information, obtained from robotic orbiters, landers, and mobile laboratories interconnected by a sophisticated Mars/Earth communications network. The present-day planning and implementation of space probe missions to Mars <mark>utilize the same principles of relative motion and gravity that were investigated by Brahe in the late 1500s and by Kepler in the early 1600s</mark><sup class="q">#4</sup>.</p>' },

  // ---------- page ----------
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  let checks = store.get('um4-checks', null), savedScreen = store.get('um4-screen', null);
  if (!checks) {
    // Carry over progress from before the 3 front-page screens were added after screen 1.
    const old = store.get('um3-checks', {}), K = 3, os = store.get('um3-screen', 0) | 0; checks = {};
    Object.keys(old).forEach(k => { const m = /^c-(\d+)-(\d+)$/.exec(k); if (m) { const i = +m[1]; checks['c-' + (i === 0 ? 0 : i + K) + '-' + m[2]] = old[k]; } });
    if (os > 0 || Object.keys(old).some(k => !/^c-0-/.test(k))) for (let i = 1; i <= K; i++) S[i].todo.forEach((_, j) => { checks['c-' + i + '-' + j] = true; });
    savedScreen = os > 0 ? os + K : os; store.set('um4-checks', checks); store.set('um4-screen', savedScreen);
  }
  // Students who already got past screen 1 keep their place after screen 1 gained a checkbox.
  if (Object.keys(checks).some(k => /^c-[1-9]/.test(k) && checks[k])) S[0].todo.forEach((_, j) => { checks['c-0-' + j] = true; });
  // A "Why calculate percent error?" screen was added before Step 16. Saved progress from after that point moves down one screen.
  if (!store.get('um4-pe', false)) {
    const P = S.findIndex(x => x.tag === 'Calculate · Read first'), nc = {};
    Object.keys(checks).forEach(k => { const m = /^c-(\d+)-(\d+)$/.exec(k); nc[m && +m[1] >= P ? 'c-' + (+m[1] + 1) + '-' + m[2] : k] = checks[k]; });
    checks = nc; if (savedScreen != null && (savedScreen | 0) >= P) savedScreen = (savedScreen | 0) + 1;
    store.set('um4-checks', checks); store.set('um4-screen', savedScreen); store.set('um4-pe', true);
  }
  let cur = Math.min(S.length - 1, Math.max(0, savedScreen | 0));
  for (let j = 0; j < cur; j++) { if (!S[j].todo.every((_, k) => !!checks['c-' + j + '-' + k])) { cur = j; break; } }
  let t0 = 0, raf = 0;

  const bar = document.getElementById('bar');
  S.forEach((s, i) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Screen ' + (i + 1) + ': ' + s.tag); b.title = s.tag; b.addEventListener('click', () => { if (canGo(i)) show(i); }); bar.appendChild(b); });
  const skip = document.getElementById('skip'), PARTS = [];
  S.forEach((x, i) => { if (!PARTS.length || PARTS[PARTS.length - 1].name !== x.part) PARTS.push({ name: x.part, i }); });
  PARTS.forEach(pt => { const b = document.createElement('button'); b.type = 'button'; b.textContent = pt.name; b.addEventListener('click', () => show(pt.i)); pt.btn = b; skip.appendChild(b); });
  const complete = i => S[i].todo.every((_, j) => !!checks['c-' + i + '-' + j]);
  const canGo = i => { for (let j = 0; j < i; j++) if (!complete(j)) return false; return true; };
  function updateGate() {
    const ok = complete(cur);
    document.getElementById('next').disabled = !ok;
    document.getElementById('gate').hidden = ok;
    [...bar.children].forEach((b, j) => { b.disabled = !canGo(j); });
  }

  function colorize(root) {
    if (!root) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), ns = [];
    while (w.nextNode()) ns.push(w.currentNode);
    ns.forEach(n => {
      if (n.parentNode && n.parentNode.closest && n.parentNode.closest('svg')) return;
      const parts = n.nodeValue.split(/\b(pink (?:student answer packet|packet)|(?:red|green) colored pencils?|red|green|pink|yellow)\b/i);
      if (parts.length < 2) return;
      const fr = document.createDocumentFragment();
      parts.forEach((p, i) => { if (i % 2) { const s = document.createElement('span'); s.className = 't-' + ({ r: 'red', g: 'green', p: 'pink', y: 'yellow' })[p[0].toLowerCase()]; s.textContent = p; fr.append(s); } else if (p) fr.append(document.createTextNode(p)); });
      n.replaceWith(fr);
    });
  }
  const card = document.getElementById('card');
  let cardRows = [];
  const MODES = { m1: ['g1'], m2: ['g2'], tri: ['g2', 'gt'], graph: ['gg'], area: ['ga'], kep: ['gk'], ab: ['gab'], flight: ['gf'], sat: ['gs'], card: [] };
  const ALLG = ['g1', 'g2', 'gt', 'gg', 'ga', 'gk', 'gab', 'gf', 'gs'];
  function render(t) {
    const s = S[cur]; let d = s.draw;
    if (d.then && t >= d.then.at) d = d.then;
    const on = MODES[d.mode];
    ALLG.forEach(id => { g(id).style.display = on.includes(id) ? '' : 'none'; });
    card.hidden = d.mode !== 'card';
    if (d.mode === 'graph') ggR(t);
    if (d.mode === 'area') gaR(t, d);
    if (d.mode === 'kep') gkR(t);
    if (d.mode === 'ab') gabR(t);
    if (d.mode === 'flight') gfR(t);
    if (d.mode === 'sat') gsR(t);
    if (d.mode === 'm1') m1R(t, d);
    if (d.mode === 'm2') m2R(t, d);
    if (d.mode === 'tri') { m2R(t, { pre: 0 }); tR(t); }
    if (d.mode === 'card') cardRows.forEach(r => { const p = eio((t - parseFloat(r.dataset.at)) / .5); r.style.opacity = p; r.style.transform = 'translateX(' + (18 * (1 - p)).toFixed(1) + 'px)'; });
    const done = t >= s.dur;
    const st = document.getElementById('status');
    st.classList.toggle('turn', done);
    document.getElementById('statusText').textContent = done ? (cur === 0 || s.read ? 'Read the steps, then click Next.' : 'Your turn: do this on your paper') : 'Watch';
    document.getElementById('meter').style.width = (cl(t / s.dur) * 100).toFixed(1) + '%';
  }
  function loop(now) {
    const t = (now - t0) / 1000;
    render(t);
    const s = S[cur];
    if (t < s.dur + .2 || s.draw.mars || s.draw.loop || (s.draw.then && t < s.draw.then.at + 2)) raf = requestAnimationFrame(loop);
  }
  function play() {
    cancelAnimationFrame(raf);
    if (reduce) { render(S[cur].dur + 30); return; }
    t0 = performance.now(); raf = requestAnimationFrame(loop);
  }

  function show(i) {
    cur = Math.max(0, Math.min(S.length - 1, i)); store.set('um4-screen', cur);
    const s = S[cur];
    document.getElementById('count').textContent = 'Screen ' + (cur + 1) + ' of ' + S.length;
    [...bar.children].forEach((b, j) => { b.className = j < cur ? 'done' : j === cur ? 'now' : ''; if (j === cur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
    PARTS.forEach(pt => pt.btn.classList.toggle('on', pt.name === s.part));
    document.getElementById('tag').textContent = s.tag;
    document.getElementById('title').textContent = s.title;
    document.getElementById('sub').textContent = s.read ? 'Read these steps' : 'Do this on your paper';
    document.getElementById('sub').hidden = !s.todo.length;
    const nt = document.getElementById('note'), it = document.getElementById('intro');
    nt.hidden = !s.note; nt.textContent = s.note || ''; it.hidden = !s.intro; it.textContent = s.intro || '';
    const pq = PQ[s.tag]; document.getElementById('pq').hidden = !pq; document.getElementById('pqText').textContent = pq || '';
    const pqs = PQS[s.tag]; document.getElementById('pqSimple').hidden = !pqs; document.getElementById('pqSimpleT').textContent = pqs || '';
    const ul = document.getElementById('todo'); ul.innerHTML = '';
    s.todo.forEach((txt, j) => {
      const id = 'c-' + cur + '-' + j, li = document.createElement('li'), lab = document.createElement('label'), box = document.createElement('input'), sp = document.createElement(typeof txt === 'object' ? 'div' : 'span');
      box.type = 'checkbox'; box.id = id; box.checked = !!checks[id];
      box.addEventListener('change', () => { checks[id] = box.checked; store.set('um4-checks', checks); updateGate(); });
      if (typeof txt === 'object') {
        const bb = document.createElement('b'); bb.textContent = txt.b; sp.append(bb);
        if (txt.p) { const u = document.createElement('ul'); u.className = 'pts'; txt.p.forEach(x => { const l = document.createElement('li'); l.textContent = x; u.append(l); }); sp.append(u); } else if (txt.t) sp.append(document.createTextNode(': ' + txt.t)); else if (txt.r) sp.append(document.createTextNode(' ' + txt.r));
        if (txt.s) { const st = document.createElement('span'); st.className = 'starter'; const sb = document.createElement('b'); sb.textContent = 'Sentence starter: '; st.append(sb, document.createTextNode(txt.s)); sp.append(st); }
      } else sp.textContent = txt; lab.htmlFor = id; lab.append(box, sp); li.append(lab); ul.append(li);
    });
    const rec = document.getElementById('record');
    if (s.record) { rec.hidden = false; rec.innerHTML = 'Record your answer in <b></b>'; rec.querySelector('b').textContent = s.record; } else rec.hidden = true;
    const ck = document.getElementById('check');
    if (s.check) { ck.hidden = false; document.getElementById('checkText').textContent = s.check; } else ck.hidden = true;
    document.getElementById('checkLbl').textContent = s.checkLabel || 'Check yours';
    if (s.card) { card.innerHTML = s.card; cardRows = [...card.querySelectorAll('[data-at]')]; } else { card.innerHTML = ''; cardRows = []; } card.hidden = s.draw.mode !== 'card';
    [document.getElementById('title'), ul, document.getElementById('checkText'), rec, card].forEach(colorize);
    document.getElementById('back').disabled = cur === 0;
    const nx = document.getElementById('next');
    nx.textContent = cur === 0 ? 'Start' : cur === S.length - 1 ? 'Back to the start' : 'Next';
    updateGate();
    play();
  }

  document.getElementById('back').addEventListener('click', () => show(cur - 1));
  document.getElementById('next').addEventListener('click', () => { if (complete(cur)) show(cur === S.length - 1 ? 0 : cur + 1); });
  document.getElementById('replay').addEventListener('click', play);
  document.addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT' && e.key === ' ') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); if (cur < S.length - 1 && complete(cur)) show(cur + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(cur - 1); }
  });
  show(cur);
})();
</script>
